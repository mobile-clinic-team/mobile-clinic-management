version: '3.8'

services:
  # ── Backend Node.js API ───────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mobile_clinic_backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/mobile_clinic
      JWT_ACCESS_SECRET: prod-jwt-access-secret-32-characters
      JWT_REFRESH_SECRET: prod-jwt-refresh-secret-32-characters
      PAYMENT_WEBHOOK_SECRET: dev-payment-webhook-secret-key-32ch
    depends_on:
      - postgres
      - redis

  # ── PostgreSQL 16 Primary Database ────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: mobile_clinic_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: mobile_clinic
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d:ro

  # ── Redis 7 In-Memory Cache & Session ─────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: mobile_clinic_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
